version: 2  

models:
  - name: stg_customers
    description: "Esta é uma tabela de preparação para dados de clientes do banco de dados northwinddb."
    columns:
      - name: customer_id
        description: "O identificador exclusivo para cada cliente."
        tests:
          - not_null
          - unique
      - name: name
        description: "O nome do cliente."
        tests:
          - not_null
      - name: email
        description: "O endereço de e-mail do cliente."
        tests:
          - not_null
          - unique

  - name: stg_orders
    description: "Esta é uma tabela de preparação para dados de pedidos do banco de dados northwinddb."
    columns:
      - name: order_id
        description: "O identificador exclusivo para cada pedido."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "O identificador do cliente que fez o pedido."
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: status
        description: "O status atual do pedido."
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'returned']
      